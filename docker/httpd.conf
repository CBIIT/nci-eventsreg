# Fedora supplemental configuration. Loaded by /etc/httpd/conf/httpd.conf.
# Fedora loads its own modules from conf.modules.d, including PHP-FPM routing.
# Ported from the original Alpine main config; do not use as a main config.
ServerTokens OS
ServerSignature On
LogLevel warn
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
LogFormat "%a %{X-Forwarded-For}i -> %h %l %u %t \"%r\" %>s %b" realip
CustomLog /proc/self/fd/1 realip
ErrorLog /proc/self/fd/2
<IfModule headers_module>
    RequestHeader unset Proxy early
</IfModule>
