name: Build and Push Docker Image (Dev-Prod)
on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Deployment tier'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
permissions:
  id-token: write
  contents: read
  packages: read
jobs:
  set-tier:
    name: Determine Tier
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.resolve.outputs.tier }}
    steps:
      - name: Resolve tier from input
        id: resolve
        run: |
          TIER="${{ inputs.tier }}"
          if [ -z "$TIER" ]; then
            echo "No tier selected. Failing."
            exit 1
          fi
          echo "Resolved tier: $TIER"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
  build-base-image:
    name: Build Base Image
    needs: set-tier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from the other repository
        uses: actions/checkout@v3
        with:
          repository: cbiit/drupal-docker
          ref: base
          path: ./drupal-docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the base image
        id: build-image
        run: |
          docker build --no-cache -t base ./drupal-docker
          docker save base > base-image.tar
      - name: Upload base image
        uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: base-image.tar
  build-final-image:
    needs: [set-tier, build-base-image]
    name: Build Final Image (${{ needs.set-tier.outputs.tier }})
    runs-on: ubuntu-latest
    # Binds this job to the GitHub Environment matching the tier.
    # dev -> account 124355660537, stage/prod -> account 054037142491 (shared)
    # This is also where you attach required reviewers for the prod environment,
    # and where the per-environment vars below are scoped from.
    environment: ${{ needs.set-tier.outputs.tier }}
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      tier: ${{ needs.set-tier.outputs.tier }}
    steps:
      - name: Download base image
        uses: actions/download-artifact@v4
        with:
          name: base-image
      - name: Load base image
        run: |
          docker load < base-image.tar
      - name: Checkout code from this repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region: us-east-1
          # Environment-scoped var:
          #   dev   -> role in account 124355660537
          #   stage -> role in account 054037142491
          #   prod  -> role in account 054037142491 (ideally a separate, more restricted role than stage)
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Resolve image tag for tier
        id: tag
        run: |
          # dev   -> dev
          # stage -> stage
          # prod  -> latest  (explicit mapping, not a guess)
          case "${{ needs.set-tier.outputs.tier }}" in
            dev)   TAG="dev" ;;
            stage) TAG="stage" ;;
            prod)  TAG="latest" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and push the drupal image
        id: build-image
        env:
          # Environment-scoped vars:
          #   dev      -> 124355660537.dkr.ecr.us-east-1.amazonaws.com
          #   stage    -> 054037142491.dkr.ecr.us-east-1.amazonaws.com  (same value as prod)
          #   prod     -> 054037142491.dkr.ecr.us-east-1.amazonaws.com  (same value as stage)
          # ECR_REPOSITORY is the same shared repo name across stage/prod;
          # the tag (dev/stage/latest) is what distinguishes the images
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building and pushing $IMAGE"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build --no-cache -t $IMAGE ./docker
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
  start-new-container:
    needs: [set-tier, build-final-image]
    runs-on: ubuntu-latest
    name: Start New Container (${{ needs.set-tier.outputs.tier }})
    # Same environment binding here, so this job also uses the correct
    # account's role to deploy, and prod approval gates (if configured)
    # apply before this job runs too.
    environment: ${{ needs.set-tier.outputs.tier }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
      - name: Get ECS Service Name
        id: get-service-name
        env:
          CLUSTER_NAME: ${{ vars.ECS_CLUSTER }}
        run: |
          SERVICE_ARN=$(aws ecs list-services --cluster "$CLUSTER_NAME" --query "serviceArns[0]" --output text)
          SERVICE_NAME=$(basename $SERVICE_ARN)
          echo "Service name: $SERVICE_NAME"
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
      - name: Deploy to ECS
        env:
          AWS_REGION: us-east-1
          CLUSTER_NAME: ${{ vars.ECS_CLUSTER }}
          SERVICE_NAME: ${{ steps.get-service-name.outputs.service_name }}
          CONTAINER_NAME: drupal
          IMAGE_URI: ${{ needs.build-final-image.outputs.image }}
        run: |
          echo "Deploying $IMAGE_URI to ECS service $SERVICE_NAME"
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment
